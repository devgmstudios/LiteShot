name: Mac

on:
  push:
    paths: ['mac/**', '.github/workflows/mac.yml', 'server/public/img/icon-256.png']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: swift --version && sw_vers

      - name: Test the core
        working-directory: mac
        run: swift test

      - name: Build LiteShot.app
        working-directory: mac
        env:
          BUILD: ${{ github.run_number }}
        run: |
          chmod +x scripts/bundle.sh
          ./scripts/bundle.sh

      - name: Draw the UI and check the toolbars
        working-directory: mac
        run: ./dist/LiteShot.app/Contents/MacOS/LiteShot --render-shots dist/shots

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: LiteShot-mac
          path: mac/dist/*.zip

      - name: Upload the UI shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: mac/dist/shots
